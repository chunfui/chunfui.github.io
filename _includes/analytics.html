{%- assign ba_slug = page.url | remove_first: "/" -%}
<div class="post-like" id="post-like" hidden>
  <button type="button" class="like-btn" aria-pressed="false" aria-label="Like this post">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 4.5 6 4.5c2.1 0 3.4 1.1 4 2.1.6-1 1.9-2.1 4-2.1 3.7 0 5.6 3.9 4 7.2C19.5 16.4 12 21 12 21z"/></svg>
    <span class="like-count">0</span>
  </button>
  <span class="like-hint">Found this useful? Leave a like.</span>
</div>
<script>
(function () {
  var API = "{{ site.analytics_endpoint | default: 'https://blog-analytics.intel.com' }}";
  var slug = {{ ba_slug | jsonify }};
  var box = document.getElementById("post-like");
  if (!box || !window.fetch) return;
  var btn = box.querySelector(".like-btn");
  var cnt = box.querySelector(".like-count");

  function call(path, opts) {
    opts = opts || {};
    var ctl = window.AbortController ? new AbortController() : null;
    if (ctl) { opts.signal = ctl.signal; setTimeout(function () { ctl.abort(); }, 4000); }
    opts.mode = "cors";
    return fetch(API + path, opts).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }
  function render(d) {
    cnt.textContent = d.count;
    btn.setAttribute("aria-pressed", d.liked ? "true" : "false");
    btn.classList.toggle("liked", !!d.liked);
  }

  // The tracker is Intel-internal; outside the network these calls fail
  // silently and the like box stays hidden.
  call("/api/track", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ slug: slug }),
    keepalive: true
  }).catch(function () {});

  call("/api/likes/" + encodeURI(slug)).then(function (d) {
    render(d);
    box.hidden = false;
  }).catch(function () {});

  btn.addEventListener("click", function () {
    btn.disabled = true;
    call("/api/like/" + encodeURI(slug), { method: "POST" })
      .then(render)
      .catch(function () {})
      .then(function () { btn.disabled = false; });
  });
})();
</script>
